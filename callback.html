<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TikTok Login Callback</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .box { background: #f7f7f7; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
</style>
</head>
<body>
<h1>Autenticación completada</h1>
<p>Copia el valor de <strong>code</strong> de abajo y pégalo donde el script te lo pida.</p>
<div class="box" id="out">Leyendo parámetros...</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const out = document.getElementById('out');
  if (error) {
    out.innerHTML = '<p><strong>Error:</strong> ' + error + '</p><p>' + (params.get('error_description') || '') + '</p>';
  } else if (code) {
    out.innerHTML = '<p><strong>code:</strong><br><code>' + code + '</code></p><p><strong>state:</strong><br><code>' + (state || '') + '</code></p>';
  } else {
    out.innerHTML = '<p>No se recibió ningún código en la URL.</p>';
  }
</script>
</body>
</html>
